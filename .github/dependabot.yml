# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Node.js dependencies (broker server + lib)
  - package-ecosystem: "npm"
    directory: "/broker"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    labels:
      - "dependencies"
      - "broker"
    commit-message:
      prefix: "broker(deps)"

  # Python SDK
  - package-ecosystem: "pip"
    directory: "/sdk/python"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "sdk-python"

  # Go SDK
  - package-ecosystem: "gomod"
    directory: "/sdk/go"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "sdk-go"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(actions)"

  # Docker
  - package-ecosystem: "docker"
    directory: "/broker"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "broker(docker)"

# Ignore major version bumps for actions/docker (manual review needed)
ignore:
  - dependency-name: "*"
    update-types: ["version-update:semver-major"]
