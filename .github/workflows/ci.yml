# .github/workflows/ci.yml
# Runs on every push and PR. No deploys. Just: secrets-safe check, lint, test.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

env:
  REGISTRY_ALIYUN: registry.cn-hangzhou.aliyuncs.com
  REGISTRY_TENCENT: ccr.ccs.tencentyun.com

jobs:

  # ============================================================
  # 1. 密钥泄漏扫描
  # ============================================================
  secret-scan:
    name: gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ============================================================
  # 2. Broker 服务端测试
  # ============================================================
  broker-test:
    name: Broker test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: broker/package.json

      - name: Install broker deps
        working-directory: broker
        run: npm ci

      - name: Run complete broker regression suite
        working-directory: broker
        run: npm run test:verify

      - name: Lint broker
        working-directory: broker
        run: |
          node -c server.js
          node --check server.js

  # ============================================================
  # 3. 客户端 CLI 语法检查
  # ============================================================
  cli-syntax:
    name: CLI syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
      - name: Check CLI
        run: |
          node --check cli/secret-broker.js
          node cli/secret-broker.js help > /dev/null

  # ============================================================
  # 4. Terraform validate
  # ============================================================
  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [infra/aliyun/broker, infra/tencent]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.7.x
      - name: terraform init (no backend) + validate
        working-directory: ${{ matrix.dir }}
        run: |
          terraform init -backend=false
          terraform validate
          terraform fmt -check -recursive

  # ============================================================
  # 6. Broker Docker 镜像构建
  # ============================================================
  broker-image:
    name: Build broker image
    runs-on: ubuntu-latest
    needs: [broker-test, secret-scan]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build broker Docker image
        run: |
          docker build --target production -t sops-age-template/broker:${{ github.sha }} -f Dockerfile .
          echo "Built: sops-age-template/broker:${{ github.sha }}"
      - name: Verify hardened image and secret-free filesystem
        run: |
          image="sops-age-template/broker:${{ github.sha }}"
          test "$(docker inspect --format '{{.Config.User}}' "$image")" != "0"
          cid="$(docker create "$image")"
          docker export "$cid" -o broker-image.tar
          docker rm "$cid"
          if tar -tf broker-image.tar | grep -E '(^|/)(\.env|[^/]*\.(key|p12|pfx)|secrets-detail\.json)$'; then
            echo "::error::sensitive file found in image"
            exit 1
          fi
