# .github/workflows/ci.yml
# Runs on every push and PR. No deploys. Just: secrets-safe check, lint, test.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

env:
  REGISTRY_ALIYUN: registry.cn-hangzhou.aliyuncs.com
  REGISTRY_TENCENT: ccr.ccs.tencentyun.com

jobs:

  # ============================================================
  # 1. 密钥泄漏扫描
  # ============================================================
  secret-scan:
    name: gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ============================================================
  # 2. Broker 服务端测试
  # ============================================================
  broker-test:
    name: Broker test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v7

      - name: Install verified sops + age
        run: |
          sudo env SOPS_VERSION=3.13.3 sh scripts/ci/install-sops.sh /usr/local/bin/sops
          sudo env AGE_VERSION=1.3.2 sh scripts/ci/install-age.sh /usr/local/bin

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: broker/package-lock.json

      - name: Setup Python for the SDK regression suite
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sdk/python/requirements-dev.txt

      - name: Install broker deps
        working-directory: broker
        run: npm ci

      - name: Run the complete gate including hermetic broker startup
        working-directory: broker
        # test:startup generates its own CA/clients and asserts real TLS and
        # process exit behavior. It never copies repository/private host keys.
        # Actual SOPS + Docker + Nginx acceptance is a separate preproduction gate.
        run: |
          npm run quality:gate
          npm audit --omit=dev --audit-level=high

  # ============================================================
  # 3. 客户端 CLI 语法检查
  # ============================================================
  cli-syntax:
    name: CLI syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Check CLI
        run: |
          node --check cli/secret-broker.js
          node cli/secret-broker.js help > /dev/null

  # ============================================================
  # 4. Terraform validate
  # ============================================================
  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [infra/aliyun, infra/tencent]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.x
      - name: terraform init (no backend) + validate
        working-directory: ${{ matrix.dir }}
        run: |
          terraform init -backend=false
          terraform validate
          terraform fmt -check -recursive

  # ============================================================
  # 6. Broker Docker 镜像构建
  # ============================================================
  broker-image:
    name: Build broker image
    runs-on: ubuntu-latest
    needs: [broker-test, secret-scan]
    steps:
      - uses: actions/checkout@v7
      - name: Build the release production image
        run: |
          docker build \
            --target production \
            -t sops-age-template/broker:${{ github.sha }} \
            -t sops-age-template/broker:latest \
            .
          echo "Built: sops-age-template/broker:${{ github.sha }}"

      - name: Verify production runtime and secret-free image
        run: |
          docker run --rm --entrypoint sh sops-age-template/broker:latest -ec '
            test "$(id -u)" != "0"
            test -f /app/server.js
            test ! -e /app/.env
            for bin in node sops openssl ssh ssh-keygen git; do
              command -v "$bin" >/dev/null
            done
            if find /app -type f \( -name "*.key" -o -name "*.pem" -o -name "*.p12" -o -name "*.pfx" \) | grep -q .; then
              echo "secret-like file found in production image" >&2
              exit 1
            fi
          '
