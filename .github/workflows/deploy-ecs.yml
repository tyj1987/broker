# Deploy broker code to the Aliyun ECS systemd host (52trz.com).
# Does not require the ECS to fetch GitHub — the runner copies files over SSH.
#
# Required repository secrets:
#   ECS_HOST       e.g. 47.94.225.76
#   ECS_SSH_KEY    private key that can ssh as root
#   ECS_SSH_USER   optional, default root

name: Deploy ECS

on:
  push:
    branches: [master]
    paths:
      - 'broker/**'
      - 'scripts/broker/nginx-broker.52trz.com.conf'
      - '.github/workflows/deploy-ecs.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'tyj1987/broker'
    steps:
      - uses: actions/checkout@v4

      - name: Copy broker files over SSH
        uses: appleboy/scp-action@v0.1.27
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_SSH_USER || 'root' }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: "broker/server.js,broker/version.js,broker/package.json,broker/routes/*,broker/lib/*,broker/dashboard/**,broker/service-templates.js,broker/type-schemas.js,scripts/broker/nginx-broker.52trz.com.conf"
          target: /tmp/broker-deploy
          strip_components: 0

      - name: Restart secret-broker
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_SSH_USER || 'root' }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -euo pipefail
            SRC=/tmp/broker-deploy
            DST=/opt/secret-broker
            test -f "$SRC/broker/server.js"
            cp -a "$SRC/broker/." "$DST/broker/"
            if [ -f "$SRC/scripts/broker/nginx-broker.52trz.com.conf" ]; then
              cp "$SRC/scripts/broker/nginx-broker.52trz.com.conf" /etc/nginx/vhost/broker.52trz.com.conf
              nginx -t && nginx -s reload
            fi
            node --check "$DST/broker/server.js"
            systemctl restart secret-broker
            sleep 2
            systemctl is-active secret-broker
            curl -sk https://127.0.0.1:8443/health
            echo
