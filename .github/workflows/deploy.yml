# .github/workflows/deploy.yml
# 推送到阿里云 ACR + 腾讯云 TCR
# 生产密钥通过云 KMS 解密（不依赖本地明文私钥）

name: Build & Push

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  REGISTRY_ALIYUN: registry.cn-hangzhou.aliyuncs.com
  REGISTRY_TENCENT: ccr.ccs.tencentyun.com
  NAMESPACE: ${{ github.repository_owner }}
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push (双云)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_ALIYUN }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Login to Tencent TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_TENCENT }}
          username: ${{ secrets.TENCENT_TCR_USERNAME }}
          password: ${{ secrets.TENCENT_TCR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_ALIYUN }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY_TENCENT }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================
  # 生产部署（云 KMS 解密密钥）
  # ============================
  deploy-prod:
    name: Deploy to Prod (云 KMS 解密)
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cloud: [aliyun, tencent]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sops & age
        run: |
          curl -LO https://github.com/getsops/sops/releases/download/v3.9.0/sops-v3.9.0.linux.amd64
          sudo install -m 755 sops-v3.9.0.linux.amd64 /usr/local/bin/sops
          curl -LO https://github.com/FiloSottile/age/releases/download/v1.2.0/age-v1.2.0-linux-amd64.tar.gz
          tar -xzf age-v1.2.0-linux-amd64.tar.gz
          sudo install -m 755 age/age /usr/local/bin/age

      # 阿里云用 OIDC 拿临时凭证 → KMS 解密
      - name: Configure Aliyun credentials (OIDC)
        if: matrix.cloud == 'aliyun'
        uses: aliyun/aliyun-cli-action@v1.2.0
        with:
          ALIYUN_REGION: cn-hangzhou
          ALIYUN_OIDC_PROVIDER_ARN: ${{ secrets.ALIYUN_OIDC_PROVIDER_ARN }}
          ALIYUN_OIDC_ROLE_ARN: ${{ secrets.ALIYUN_OIDC_ROLE_ARN }}
          ALIYUN_OIDC_TOKEN_FILE_PATH: ${{ github.token }}

      - name: Decrypt prod secrets (Aliyun KMS)
        if: matrix.cloud == 'aliyun'
        run: |
          sops --decrypt --output-type dotenv secrets/prod.yaml > .env.production
          echo "✅ Aliyun KMS 解密成功"

      # 腾讯云用 secret_id/secret_key
      - name: Configure Tencent credentials
        if: matrix.cloud == 'tencent'
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: |
          echo "TENCENTCLOUD_SECRET_ID=$TENCENTCLOUD_SECRET_ID" >> $GITHUB_ENV

      - name: Decrypt prod secrets (Tencent KMS)
        if: matrix.cloud == 'tencent'
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: |
          sops --decrypt --output-type dotenv secrets/prod.yaml > .env.production
          echo "✅ Tencent KMS 解密成功"

      - name: Deploy to ${{ matrix.cloud }}
        working-directory: infra/${{ matrix.cloud }}
        run: |
          echo "🚀 部署到 ${{ matrix.cloud }}..."
          # 实际部署逻辑（terraform apply / kubectl apply 等）
          # 这里只是占位，根据你真实的基础设施调整
          echo "（请根据实际部署方式调整）"

      - name: Cleanup secrets
        if: always()
        run: rm -f .env.production
