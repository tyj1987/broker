# .github/workflows/deploy.yml
# Build multi-arch image, push to BOTH Aliyun ACR and Tencent TCR,
# then run Terraform apply for each cloud.
#
# Production secrets are decrypted with cloud KMS (Aliyun KMS or
# Tencent KMS) — no plaintext credentials are ever present in
# GitHub Secrets or in this workflow's environment.
#
# Required GitHub repository secrets / variables:
#   ALIYUN_OIDC_PROVIDER_ARN          (e.g. acs:ram::1234:oidc-provider/github)
#   ALIYUN_OIDC_ROLE_ARN              (e.g. acs:ram::1234:role/github-deploy)
#   ALIYUN_ACR_USERNAME               (Aliyun container registry username)
#   ALIYUN_ACR_PASSWORD               (Aliyun container registry password)
#   TENCENTCLOUD_SECRET_ID            (Tencent Cloud API key id)
#   TENCENTCLOUD_SECRET_KEY           (Tencent Cloud API key secret)
#   TENCENT_TCR_USERNAME              (Tencent TCR username)
#   TENCENT_TCR_PASSWORD              (Tencent TCR password)

name: Build & Deploy

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Override image tag (defaults to git SHA)'
        required: false

permissions:
  id-token: write
  contents: read

env:
  REGISTRY_ALIYUN: registry.cn-hangzhou.aliyuncs.com
  REGISTRY_TENCENT: ccr.ccs.tencentyun.com
  NAMESPACE: ${{ github.repository_owner }}
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}

jobs:
  build-and-push:
    name: Build + Push (Aliyun + Tencent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_ALIYUN }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Login to Tencent TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_TENCENT }}
          username: ${{ secrets.TENCENT_TCR_USERNAME }}
          password: ${{ secrets.TENCENT_TCR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_ALIYUN }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY_TENCENT }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-aliyun:
    name: Deploy to Aliyun
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production-aliyun
    steps:
      - uses: actions/checkout@v4

      - name: Install sops + age + terraform
        run: |
          curl -LO https://github.com/getsops/sops/releases/download/v3.9.0/sops-v3.9.0.linux.amd64
          sudo install -m 755 sops-v3.9.0.linux.amd64 /usr/local/bin/sops
          curl -LO https://github.com/FiloSottile/age/releases/download/v1.2.0/age-v1.2.0-linux-amd64.tar.gz
          tar -xzf age-v1.2.0-linux-amd64.tar.gz
          sudo install -m 755 age/age /usr/local/bin/age
          curl -LO https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip
          sudo install -m 755 terraform /usr/local/bin/terraform

      - name: Configure Aliyun credentials via OIDC
        uses: aliyun/aliyun-cli-action@v1.2.0
        with:
          ALIYUN_REGION: cn-hangzhou
          ALIYUN_OIDC_PROVIDER_ARN: ${{ secrets.ALIYUN_OIDC_PROVIDER_ARN }}
          ALIYUN_OIDC_ROLE_ARN: ${{ secrets.ALIYUN_OIDC_ROLE_ARN }}
          ALIYUN_OIDC_TOKEN_FILE_PATH: ${{ github.token }}

      - name: Terraform apply (Aliyun)
        working-directory: infra/aliyun
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="image_tag=${{ env.IMAGE_TAG }}"

  deploy-tencent:
    name: Deploy to Tencent
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production-tencent
    steps:
      - uses: actions/checkout@v4

      - name: Install sops + age + terraform
        run: |
          curl -LO https://github.com/getsops/sops/releases/download/v3.9.0/sops-v3.9.0.linux.amd64
          sudo install -m 755 sops-v3.9.0.linux.amd64 /usr/local/bin/sops
          curl -LO https://github.com/FiloSottile/age/releases/download/v1.2.0/age-v1.2.0-linux-amd64.tar.gz
          tar -xzf age-v1.2.0-linux-amd64.tar.gz
          sudo install -m 755 age/age /usr/local/bin/age
          curl -LO https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip
          sudo install -m 755 terraform /usr/local/bin/terraform

      - name: Configure Tencent credentials
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: echo "credentials configured in env"

      - name: Terraform apply (Tencent)
        working-directory: infra/tencent
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="image_tag=${{ env.IMAGE_TAG }}"
