# .github/workflows/deploy.yml
# 打包 + 推送 broker 镜像到双云 registry + 双云 Terraform apply
# 触发：v* tag push 或手动 dispatch
#
# 阿里云控制面通过 OIDC 获取短期凭据；Registry 登录与腾讯云凭据使用 GitHub 加密 Secrets。
# Required GitHub repository secrets (encrypted):
#   ALIYUN_OIDC_PROVIDER_ARN        e.g. acs:ram::1234:oidc-provider/github
#   ALIYUN_OIDC_ROLE_ARN            e.g. acs:ram::1234:role/github-deploy
#   ALIYUN_ACR_USERNAME             Aliyun container registry username
#   ALIYUN_ACR_PASSWORD             Aliyun container registry password
#   TENCENTCLOUD_SECRET_ID          Tencent Cloud API key id
#   TENCENTCLOUD_SECRET_KEY         Tencent Cloud API key secret
#   TENCENT_TCR_USERNAME            Tencent TCR username
#   TENCENT_TCR_PASSWORD            Tencent TCR password

name: Build & Deploy

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Override image tag (defaults to git SHA)'
        required: false

# Read-only by default; OIDC is scoped to the Aliyun deployment job.
permissions:
  contents: read

env:
  REGISTRY_ALIYUN: registry.cn-hangzhou.aliyuncs.com
  REGISTRY_TENCENT: ccr.ccs.tencentyun.com
  NAMESPACE: ${{ github.repository_owner }}
  IMAGE_NAME: sops-age-template-broker
  IMAGE_TAG: ${{ github.event.inputs.image_tag || github.ref_name }}

jobs:

  # ============================================================
  # 0. 发布前质量门禁
  # ============================================================
  quality-gate:
    name: Deployment quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: broker/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sdk/python/requirements-dev.txt
      - name: Install dependencies and validate
        working-directory: broker
        run: |
          npm ci
          npm run quality:gate
          npm audit --omit=dev --audit-level=high

  # ============================================================
  # 1. Build + Push 到双 registry
  # ============================================================
  build-and-push:
    name: Build + Push (Aliyun + Tencent)
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Aliyun ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_ALIYUN }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Login to Tencent TCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_TENCENT }}
          username: ${{ secrets.TENCENT_TCR_USERNAME }}
          password: ${{ secrets.TENCENT_TCR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY_ALIYUN }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY_TENCENT }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - name: Build and push broker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # 2. 部署到阿里云
  # ============================================================
  deploy-aliyun:
    name: Deploy broker to Aliyun
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production-aliyun
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3

      - name: Install verified sops + age
        run: |
          sudo env SOPS_VERSION=3.13.3 sh scripts/ci/install-sops.sh /usr/local/bin/sops
          sudo env AGE_VERSION=1.3.2 sh scripts/ci/install-age.sh /usr/local/bin

      - name: Install Aliyun CLI
        uses: aliyun/setup-aliyun-cli-action@v1
        with:
          version: '3.5.1'

      - name: Configure Aliyun credentials via OIDC
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ secrets.ALIYUN_OIDC_ROLE_ARN }}
          oidc-provider-arn: ${{ secrets.ALIYUN_OIDC_PROVIDER_ARN }}
          role-session-name: github-broker-deploy
          role-session-expiration: 1800
          audience: ${{ vars.ALIYUN_OIDC_AUDIENCE || 'sts.aliyuncs.com' }}

      - name: Terraform apply broker (Aliyun)
        working-directory: infra/aliyun
        env:
          TF_VAR_image_tag: ${{ env.IMAGE_TAG }}
        run: |
          terraform init
          terraform apply -auto-approve

  # ============================================================
  # 3. 部署到腾讯云
  # ============================================================
  deploy-tencent:
    name: Deploy broker standby to Tencent
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production-tencent
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3

      - name: Install verified sops + age
        run: |
          sudo env SOPS_VERSION=3.13.3 sh scripts/ci/install-sops.sh /usr/local/bin/sops
          sudo env AGE_VERSION=1.3.2 sh scripts/ci/install-age.sh /usr/local/bin

      - name: Configure Tencent credentials
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: echo "credentials configured in env"

      - name: Terraform apply broker (Tencent)
        working-directory: infra/tencent
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TF_VAR_image_tag: ${{ env.IMAGE_TAG }}
        run: |
          terraform init
          terraform apply -auto-approve
