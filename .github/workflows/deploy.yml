name: Build signed release candidate

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

# This workflow deliberately does not deploy to either cloud. Cloud deployment
# remains fail-closed until both providers use short-lived workload identity and
# the runtime consumes this exact signed digest. Environment approval alone does
# not make long-lived registry or cloud credentials acceptable.
permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan complete history for secrets before publishing
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Set up Node.js for release gates
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: broker/package-lock.json

      - name: Install locked dependencies and run release gates
        working-directory: broker
        run: |
          npm ci
          npm run test:verify
          npm run coverage:security
          npm run supply-chain:verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to GHCR with the job-scoped token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push immutable candidate
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Sign and verify the immutable digest with GitHub OIDC
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          test -n "$DIGEST"
          case "$DIGEST" in sha256:[0-9a-f][0-9a-f]*) ;; *) exit 1 ;; esac
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"

      - name: Verify SBOM and SLSA provenance attestations
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          IDENTITY="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@${GITHUB_REF}"
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"

      - name: Record release evidence
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p release-evidence
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > release-evidence/image.txt
          printf '%s\n' "$GITHUB_SHA" > release-evidence/commit.txt
          printf '%s\n' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@${GITHUB_REF}" > release-evidence/identity.txt

      - name: Upload immutable evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90
