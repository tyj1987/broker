# .github/workflows/release.yml
# V4.8.0: SBOM generation + cosign keyless signing on release tags.
# Closes SECURITY-AUDIT-2026-09-05.md SEC-006 (SBOM/signing workflow not executed).
#
# Triggers: `v*.*.*` tag push, or manual workflow_dispatch.
# Outputs:
#   - ghcr.io/tyj1987/broker:<tag>      signed image (keyless OIDC, GitHub)
#   - .sbom/spdx.json                   SPDX SBOM attached as cosign attestation
#   - .sbom/cyclonedx.json              CycloneDX SBOM (alternate format)
#
# Required secrets / permissions:
#   - contents: write  (to create the GitHub Release)
#   - packages: write  (to push to GHCR)
#   - id-token: write  (for cosign keyless OIDC)

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v4.8.0). Default: latest tag.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ============================================================
  # Build + sign + attest
  # ============================================================
  build-and-sign:
    name: Build, sign, attest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
          echo "value=${{ steps.tag.outputs.name }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value={{steps.tag.outputs.name}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ============================================================
      # SBOM: SPDX + CycloneDX
      # ============================================================
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          artifact-name: broker.spdx.json

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          artifact-name: broker.cyclonedx.json

      # ============================================================
      # Sign image digest + attach SBOM as attestation
      # ============================================================
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with keyless OIDC
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.meta.outputs.digest }}"
          cosign sign --yes "$IMAGE"

      - name: Attach SBOM attestation (SPDX)
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.meta.outputs.digest }}"
          cosign attest --yes --predicate broker.spdx.json --type spdxjson "$IMAGE"

      - name: Self-verify signature
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.meta.outputs.digest }}"
          cosign verify --certificate-identity-regexp 'https://github.com/.*' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$IMAGE"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            broker.spdx.json
            broker.cyclonedx.json

      # ============================================================
      # Create GitHub Release with SBOM attachments
      # ============================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            broker.spdx.json
            broker.cyclonedx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
