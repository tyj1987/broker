# .github/workflows/release.yml
# V4.8.0: SBOM generation + cosign keyless signing on release tags.
# Closes SECURITY-AUDIT-2026-09-05.md SEC-006 (SBOM/signing workflow not executed).
#
# Triggers: `v*.*.*` tag push, or manual workflow_dispatch.
# Outputs:
#   - ghcr.io/tyj1987/broker:<tag>      signed image (keyless OIDC, GitHub)
#   - broker.spdx.json                  SPDX SBOM for the published image digest
#   - broker.cyclonedx.json             CycloneDX SBOM for the same image digest
#
# Required secrets / permissions:
#   - contents: write  (to create the GitHub Release)
#   - packages: write  (to push to GHCR)
#   - id-token: write  (for cosign keyless OIDC)

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (for example v4.9.0)'
        required: true

# Read-only by default. Publishing privileges are scoped to build-and-sign.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ============================================================
  # Release quality gate — publishing is blocked unless every check passes.
  # ============================================================
  quality-gate:
    name: Release quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: broker/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sdk/python/requirements-dev.txt

      - name: Install broker dependencies
        working-directory: broker
        run: npm ci

      - name: Run quality gate
        working-directory: broker
        run: npm run quality:gate

      - name: Audit production dependencies
        working-directory: broker
        run: npm audit --omit=dev --audit-level=high

  # ============================================================
  # Build + sign + attest
  # ============================================================
  build-and-sign:
    name: Build, sign, attest
    runs-on: ubuntu-latest
    needs: quality-gate
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve and validate tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must look like v4.9.0; got '$TAG'"
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.name }}
            type=raw,value=latest,enable=${{ !contains(steps.tag.outputs.name, '-') }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ============================================================
      # SBOM: SPDX + CycloneDX
      # ============================================================
      - name: Generate image SBOM (SPDX)
        uses: anchore/sbom-action@v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: broker.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate image SBOM (CycloneDX)
        uses: anchore/sbom-action@v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: broker.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate generated SBOM files
        shell: bash
        run: |
          test -s broker.spdx.json
          test -s broker.cyclonedx.json
          node -e "for (const file of ['broker.spdx.json','broker.cyclonedx.json']) JSON.parse(require('fs').readFileSync(file, 'utf8'))"

      # ============================================================
      # Sign image digest + attach SBOM as attestation
      # ============================================================
      - name: Install cosign
        uses: sigstore/cosign-installer@v4

      - name: Sign image with keyless OIDC
        env:
          COSIGN_EXPERIMENTAL: 1
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Attach SBOM attestation (SPDX)
        env:
          COSIGN_EXPERIMENTAL: 1
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign attest --yes --predicate broker.spdx.json --type spdxjson "$IMAGE"

      - name: Self-verify signature and SBOM attestation
        env:
          COSIGN_EXPERIMENTAL: 1
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          cosign verify \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$IMAGE" > verified-signature.json
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$IMAGE" > verified-spdx-attestation.json
          test -s verified-signature.json
          test -s verified-spdx-attestation.json

      - name: Upload release verification artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-verification
          path: |
            broker.spdx.json
            broker.cyclonedx.json
            verified-signature.json
            verified-spdx-attestation.json
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # Create GitHub Release with SBOM attachments
      # ============================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          generate_release_notes: true
          files: |
            broker.spdx.json
            broker.cyclonedx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
