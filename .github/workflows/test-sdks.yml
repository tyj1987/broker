name: SDK tests

# Tests for the official client SDKs (Python, Go).
# Runs on every push to main and every PR.
# Independent of broker/server (no Node, no broker binary needed).

on:
  push:
    branches: [main, master, v4.x]
    paths:
      - 'sdk/**'
      - '.github/workflows/test-sdks.yml'
  pull_request:
    branches: [main, master, v4.x]
    paths:
      - 'sdk/**'

jobs:
  # ============================================================
  # Python SDK
  # ============================================================
  python-sdk:
    name: Python SDK (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install pytest + cryptography
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio cryptography
        # cryptography is only needed by the test fixtures (self-signed cert)
        # but the SDK itself is zero-dep.

      - name: Run pytest
        shell: bash
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Verify zero runtime deps
        shell: bash
        run: |
          # The SDK's pyproject.toml must list zero runtime dependencies.
          python -c "import tomllib, sys; d = tomllib.loads(open('pyproject.toml').read().split('[project]',1)[1].split('dependencies',1)[0] + '0'); print('runtime deps:', d.get('dependencies', []))"
          if python -c "import tomli; t = tomli.loads(open('pyproject.toml').read()); assert t['project'].get('dependencies', []) == [], 'SDK must remain zero-dep'" 2>/dev/null; then :; else
            python -c "
import re
txt = open('pyproject.toml').read()
# crude: ensure 'dependencies = []' line exists under [project]
assert re.search(r'\[project\].*?dependencies\s*=\s*\[\s*\]', txt, re.S), 'SDK must remain zero-dep (dependencies = [])'
print('zero-dep OK')
"
          fi

  # ============================================================
  # Go SDK
  # ============================================================
  go-sdk:
    name: Go SDK (${{ matrix.os }} / go${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.21', '1.22', '1.23']
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: sdk/go/go.sum

      - name: Verify go.mod has zero deps
        shell: bash
        run: |
          # go.mod must NOT contain a `require (...)` block with non-stdlib modules.
          if grep -E '^\s*require\s*\(' go.mod; then
            echo "::error::go.mod must remain zero-dep (no require block)"
            exit 1
          fi
          echo "go.mod zero-dep OK"

      - name: go vet
        shell: bash
        run: go vet ./broker/...

      - name: go build
        shell: bash
        run: go build ./broker/...

      - name: go test
        shell: bash
        run: go test -race -count=1 -timeout=60s ./broker/...

  # ============================================================
  # VS Code extension (TypeScript compile)
  # ============================================================
  vscode-ext:
    name: VS Code extension (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/vscode
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdk/vscode/package.json

      - name: Install
        shell: bash
        run: npm install

      - name: TypeScript compile
        shell: bash
        run: npx tsc -p . --noEmit

      - name: Package .vsix (sanity)
        shell: bash
        run: npx vsce package --no-dependencies || true   # best-effort
