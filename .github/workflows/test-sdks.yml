name: SDK tests

# Tests for the official client SDKs (Python, Go).
# Runs on every push to main and every PR.
# Independent of broker/server (no Node, no broker binary needed).

on:
  push:
    branches: [main, v4.x]
    paths:
      - 'sdk/**'
      - '.github/workflows/test-sdks.yml'
  pull_request:
    branches: [main, v4.x]
    paths:
      - 'sdk/**'

jobs:
  # ============================================================
  # Python SDK
  # ============================================================
  python-sdk:
    name: Python SDK (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install pytest + cryptography
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
        # cryptography is only needed by the test fixtures (self-signed cert)
        # but the SDK itself is zero-dep.

      - name: Run pytest
        shell: bash
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Verify zero runtime deps
        shell: bash
        run: |
          grep -Eq '^dependencies[[:space:]]*=[[:space:]]*\[[[:space:]]*\][[:space:]]*$' pyproject.toml
          echo "zero-dep OK"

  # ============================================================
  # Go SDK
  # ============================================================
  go-sdk:
    name: Go SDK (${{ matrix.os }} / go${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.21', '1.22', '1.23']
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: sdk/go/go.sum

      - name: Verify go.mod has zero deps
        shell: bash
        run: |
          # go.mod must NOT contain a `require (...)` block with non-stdlib modules.
          if grep -E '^\s*require\s*\(' go.mod; then
            echo "::error::go.mod must remain zero-dep (no require block)"
            exit 1
          fi
          echo "go.mod zero-dep OK"

      - name: go vet
        shell: bash
        run: go vet ./broker/...

      - name: go build
        shell: bash
        run: go build ./broker/...

      - name: go test
        shell: bash
        run: go test -race -count=1 -timeout=60s ./broker/...

  # ============================================================
  # VS Code extension (TypeScript compile)
  # ============================================================
  vscode-ext:
    name: VS Code extension (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/vscode
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdk/vscode/package-lock.json

      - name: Install
        shell: bash
        run: npm ci

      - name: TypeScript compile
        shell: bash
        run: npx tsc -p . --noEmit

      - name: Package .vsix (sanity)
        shell: bash
        run: npx --no-install vsce package --no-dependencies
