name: Wire server.js Phase A-F
on:
  workflow_dispatch:
  push:
    branches: [optimize/wire-af-complete]
    paths:
      - 'scripts/broker/apply-phase-af-full-wire.mjs'
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply Phase A-F wire
        run: node scripts/broker/apply-phase-af-full-wire.mjs
      - name: Commit wired server.js
        run: |
          git config user.name "broker-wire-bot"
          git config user.email "broker-wire@users.noreply.github.com"
          git add broker/server.js
          if git diff --staged --quiet; then
            echo "No server.js changes"
          else
            git commit -m "wire: Phase A-F server.js (auto)"
            git push
          fi
