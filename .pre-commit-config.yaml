# .pre-commit-config.yaml
# Pre-commit hooks. / pre-commit 钩子。
# Install / 安装: pip install pre-commit && pre-commit install
# Run manually / 手动跑: pre-commit run --all-files

repos:
  # 通用：gitleaks 防密钥误提交 / Block plaintext secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # 通用：基础文件检查 / Basic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # SOPS 加密文件含 ENC[] 标记，关掉严格模式
        # SOPS-encrypted files contain ENC[] markers; relax strict mode
        args: ['--allow-multiple-documents']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ['--branch=main', '--branch=master']

  # V4.1.1: ESLint v9 (flat config) — catches no-undef, no-unused-vars, etc.
  # Installed locally as a dev dep; `npx --no-install` reuses it.
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: npx --no-install eslint --config eslint.config.js
        language: system
        files: '\.(js|mjs|cjs)$'
        exclude: '^(broker/dashboard/|broker/experimental/|sdk/python/|node_modules/)'

  # V4.1.1: Prettier — auto-format on commit (skips conflicts)
  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: npx --no-install prettier --write --log-level=warn
        language: system
        files: '\.(js|mjs|cjs|json|md|yml|yaml)$'
        exclude: '^(CHANGELOG\.md|broker/dashboard/|broker/experimental/|sdk/python/|node_modules/)'
