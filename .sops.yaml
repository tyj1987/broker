# .sops.yaml
# SOPS encryption rules. bootstrap.ps1 fills in the public keys.
# Docs: https://github.com/getsops/sops
#
# Note on Windows: sops 3.7.x matches path_regex against the full file path
# using Go regexp. We use filename patterns (.*common\.env$) for portability
# across Windows and Linux.

creation_rules:
  - path_regex: .*common\.env$
    key_groups:
      - age:
          - "age1lm7kxfcgjm66ayh4k6tjzaf0d7ns60w3ssz65dhvzfdfnptf5dhquma7ma"
          - "age16l7uzx7nn2deua95zefd0ygacvxgfk6yrk69qnpdeqxe93l7nckqghjjnq"

  - path_regex: .*dev\.env$
    key_groups:
      - age:
          - "age1lm7kxfcgjm66ayh4k6tjzaf0d7ns60w3ssz65dhvzfdfnptf5dhquma7ma"
          - "age16l7uzx7nn2deua95zefd0ygacvxgfk6yrk69qnpdeqxe93l7nckqghjjnq"

  - path_regex: .*prod\.env$
    key_groups:
      - age:
          - "age1lm7kxfcgjm66ayh4k6tjzaf0d7ns60w3ssz65dhvzfdfnptf5dhquma7ma"