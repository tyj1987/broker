# Taskfile.yml
# Cross-platform task runner (replaces Makefile).
# 跨平台任务编排（替代 Makefile）。
# Usage / 用法: task --list / task <name>
# Install / 安装: scoop install go-task

version: '3'

vars:
  REGISTRY_ALIYUN: registry.cn-hangzhou.aliyuncs.com/tyj1987
  REGISTRY_TENCENT: ccr.ccs.tencentyun.com/tyj1987
  IMAGE_NAME: sops-age-template-broker

tasks:
  default:
    desc: List all tasks / 列出所有任务
    cmds:
      - task --list

  # ============================
  # 工具检查 / Tool check
  # ============================
  check:
    desc: Check required tools / 检查必需工具 (sops, age, openssl, node)
    cmds:
      - pwsh -File scripts/check-tools.ps1

  # ============================
  # 密钥管理 / Secrets (SOPS + age)
  # ============================
  secrets:init:
    desc: Initialize secret system (generate age keys + encrypt first file) / 初始化密钥体系（生成 age 钥匙 + 加密第一个文件）
    cmds:
      - pwsh -File bootstrap.ps1

  secrets:edit:
    desc: Edit broker.yaml (auto decrypt -> edit -> encrypt) / 编辑 broker.yaml（自动解密 → 编辑 → 加密）
    cmds:
      - sops secrets/broker.yaml

  secrets:view:
    desc: View decrypted broker.yaml / 查看解密后内容
    cmds:
      - sops --decrypt secrets/broker.yaml

  secrets:rotate:
    desc: Rotate all age keys / 轮转所有 age 钥匙
    cmds:
      - pwsh -File scripts/rotate-keys.ps1

  # ============================
  # 备份 / Backup
  # ============================
  backup:keys:
    desc: Backup age private keys / 备份 age 私钥
    cmds:
      - pwsh -File scripts/backup-keys.ps1

  # ============================
  # Broker 测试 / Broker tests
  # ============================
  test:
    desc: Run all broker test suites / 跑全部 broker 测试
    cmds:
      - cd broker-test && node test-can-proxy.js
      - cd broker-test && node test-master-key.js
      - cd broker-test && node test-healthcheck.js
      - cd broker-test && node test-mcp-server.js
      - cd broker-test && node test-proxy-guard.js
      - cd broker-test && node test-alert-history.js

  test:one:
    desc: Run a single test suite / 跑单个测试 (e.g. task test:one -- test-healthcheck.js)
    cmds:
      - cd broker-test && node {{.CLI_ARGS}}

  # ============================
  # 构建 / Build (broker docker image)
  # ============================
  build:
    desc: Build broker Docker image (linux/amd64) / 构建 broker 镜像
    cmds:
      - docker buildx build --platform linux/amd64 -t {{.IMAGE_NAME}}:{{.TAG | default "latest"}} --load ./broker

  push:
    desc: Push broker image to dual registry (Aliyun + Tencent) / 推送到双云 registry
    cmds:
      - docker tag {{.IMAGE_NAME}}:{{.TAG | default "latest"}} {{.REGISTRY_ALIYUN}}/{{.IMAGE_NAME}}:{{.TAG | default "latest"}}
      - docker tag {{.IMAGE_NAME}}:{{.TAG | default "latest"}} {{.REGISTRY_TENCENT}}/{{.IMAGE_NAME}}:{{.TAG | default "latest"}}
      - docker push {{.REGISTRY_ALIYUN}}/{{.IMAGE_NAME}}:{{.TAG | default "latest"}}
      - docker push {{.REGISTRY_TENCENT}}/{{.IMAGE_NAME}}:{{.TAG | default "latest"}}

  # ============================
  # 部署 / Deploy
  # ============================
  deploy:aliyun:
    desc: Deploy broker to Aliyun ECS / 部署到阿里云 ECS
    cmds:
      - cd infra/aliyun/broker && terraform init
      - cd infra/aliyun/broker && terraform apply -auto-approve -var-file=b.tfvars

  deploy:tencent:
    desc: Deploy broker to Tencent CVM / 部署到腾讯云 CVM
    cmds:
      - cd infra/tencent && terraform init
      - cd infra/tencent && terraform apply -auto-approve -var-file=broker.tfvars

  # ============================
  # 清理 / Cleanup
  # ============================
  clean:
    desc: Clean local temp files / 清理本地临时文件
    cmds:
      - 'Remove-Item -ErrorAction SilentlyContinue *.dec.yaml,*.dec.yml,*.dec.env'
