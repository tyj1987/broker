# Taskfile.yml
# 跨平台任务编排（替代 Makefile）
# 用法：task --list / task <name>
# 安装：scoop install go-task

version: '3'

vars:
  APP_NAME: my-first-app
  REGISTRY_ALIYUN: registry.cn-hangzhou.aliyuncs.com/your-ns
  REGISTRY_TENCENT: ccr.ccs.tencentyun.com/your-ns

tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list

  # ============================
  # 工具检查
  # ============================
  check:
    desc: Check required tools
    cmds:
      - pwsh -File scripts/check-tools.ps1

  # ============================
  # 密钥管理
  # ============================
  secrets:init:
    desc: Initialize secret system (generate age keys + encrypt first file)
    cmds:
      - pwsh -File bootstrap.ps1

  secrets:edit:
    desc: Edit common.env (auto decrypt -> edit -> encrypt)
    cmds:
      - sops secrets/common.env

  secrets:view:
    desc: View decrypted secrets
    cmds:
      - sops --decrypt secrets/common.env

  secrets:export:
    desc: Decrypt to .env file (for tools that do not understand SOPS)
    cmds:
      - sops --decrypt --output-type dotenv secrets/common.env > .env
      - echo "✅ .env generated (gitignored)"

  secrets:rotate:
    desc: Rotate all age keys
    cmds:
      - pwsh -File scripts/rotate-keys.ps1

  # ============================
  # Backup
  # ============================
  backup:keys:
    desc: Backup age private keys
    cmds:
      - pwsh -File scripts/backup-keys.ps1

  # ============================
  # Development
  # ============================
  dev:
    desc: Start dev environment (auto-decrypt secrets + run app)
    deps: [dev:secrets, dev:run]

  dev:secrets:
    desc: Decrypt secrets to .env for the app
    cmds:
      - sops --decrypt --output-type dotenv secrets/common.env > .env

  dev:run:
    desc: Run the Node.js app
    cmds:
      - cd app && node --env-file=../.env index.js

  # ============================
  # Code quality
  # ============================
  lint:
    desc: Lint code
    cmds:
      - cd app && npm run lint

  format:
    desc: Format code
    cmds:
      - cd app && npm run format

  # ============================
  # Tests
  # ============================
  test:
    desc: Run tests
    cmds:
      - cd app && npm test

  test:coverage:
    desc: Run tests with coverage
    cmds:
      - cd app && npm run test:coverage

  # ============================
  # Build
  # ============================
  build:
    desc: Build Docker image (multi-arch)
    cmds:
      - docker buildx build --platform linux/amd64,linux/arm64 -t {{.APP_NAME}}:{{.TAG | default "latest"}} --load .

  push:
    desc: Push to Aliyun ACR + Tencent TCR
    cmds:
      - docker tag {{.APP_NAME}}:{{.TAG | default "latest"}} {{.REGISTRY_ALIYUN}}/{{.APP_NAME}}:{{.TAG | default "latest"}}
      - docker tag {{.APP_NAME}}:{{.TAG | default "latest"}} {{.REGISTRY_TENCENT}}/{{.APP_NAME}}:{{.TAG | default "latest"}}
      - docker push {{.REGISTRY_ALIYUN}}/{{.APP_NAME}}:{{.TAG | default "latest"}}
      - docker push {{.REGISTRY_TENCENT}}/{{.APP_NAME}}:{{.TAG | default "latest"}}

  # ============================
  # Deploy
  # ============================
  deploy:
    desc: Full deploy (build + push + terraform apply)
    cmds:
      - task:build
      - task:push
      - cd infra/aliyun && terraform init && terraform apply -auto-approve

  # ============================
  # Cleanup
  # ============================
  clean:
    desc: Clean temp files
    cmds:
      - rm -f .env *.dec.yaml
      - docker system prune -f
