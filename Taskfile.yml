# Taskfile.yml
# 跨平台任务编排（替代 Makefile）
# 用法：task --list / task <name>
# 安装：scoop install go-task

version: '3'

vars:
  APP_NAME: my-first-app
  REGISTRY_ALIYUN: registry.cn-hangzhou.aliyuncs.com/your-ns
  REGISTRY_TENCENT: ccr.ccs.tencentyun.com/your-ns
  AGE_KEY_DIR: '{{.USERPROFILE | default "~"}}\.config\sops\age'

tasks:
  default:
    desc: 列出所有任务
    cmds:
      - task --list

  # ============================
  # 工具检查
  # ============================
  check:
    desc: 检查必需工具
    cmds:
      - pwsh -File scripts/check-tools.ps1

  # ============================
  # 密钥管理
  # ============================
  secrets:init:
    desc: 初始化密钥体系（生成 age 钥匙 + 加密第一个文件）
    cmds:
      - pwsh -File bootstrap.ps1

  secrets:edit:
    desc: 编辑 common.yaml（自动解密 → 编辑 → 加密）
    cmds:
      - sops secrets/common.yaml

  secrets:view:
    desc: 查看解密后的密钥（不推荐日常用）
    cmds:
      - sops --decrypt secrets/common.yaml

  secrets:export:
    desc: 解密到 .env 文件（用于不支持 SOPS 的工具）
    cmds:
      - sops --decrypt --output-type dotenv secrets/common.yaml > .env.decrypted
      - echo "✅ .env.decrypted 已生成（已加入 .gitignore）"

  secrets:rotate:
    desc: 轮转所有 age 钥匙（删旧公钥 + 加新公钥 + 重加密）
    cmds:
      - pwsh -File scripts/rotate-keys.ps1

  # ============================
  # 备份
  # ============================
  backup:keys:
    desc: 备份 age 私钥到指定目录
    cmds:
      - pwsh -File scripts/backup-keys.ps1

  # ============================
  # 开发
  # ============================
  dev:
    desc: 启动开发环境
    cmds:
      - task:dev:deps
      - task:dev:run

  dev:deps:
    desc: 安装依赖
    cmds:
      - cd app && npm install
    platforms: [windows, linux, darwin]

  dev:run:
    desc: 启动开发服务器
    cmds:
      - cd app && npm run dev
    ignore_error: true

  # ============================
  # 代码质量
  # ============================
  lint:
    desc: 代码风格检查
    cmds:
      - cd app && npm run lint
    platforms: [windows, linux, darwin]

  format:
    desc: 自动格式化代码
    cmds:
      - cd app && npm run format
    platforms: [windows, linux, darwin]

  # ============================
  # 测试
  # ============================
  test:
    desc: 运行测试
    cmds:
      - cd app && npm test
    platforms: [windows, linux, darwin]

  test:coverage:
    desc: 测试 + 覆盖率报告
    cmds:
      - cd app && npm run test:coverage
    platforms: [windows, linux, darwin]

  # ============================
  # 构建
  # ============================
  build:
    desc: 构建 Docker 镜像（多架构）
    cmds:
      - docker buildx build --platform linux/amd64,linux/arm64 -t {{.APP_NAME}}:{{.TAG | default "latest"}} --load .

  push:
    desc: 推送到阿里云 + 腾讯云
    cmds:
      - docker tag {{.APP_NAME}}:{{.TAG | default "latest"}} {{.REGISTRY_ALIYUN}}/{{.APP_NAME}}:{{.TAG | default "latest"}}
      - docker tag {{.APP_NAME}}:{{.TAG | default "latest"}} {{.REGISTRY_TENCENT}}/{{.APP_NAME}}:{{.TAG | default "latest"}}
      - docker push {{.REGISTRY_ALIYUN}}/{{.APP_NAME}}:{{.TAG | default "latest"}}
      - docker push {{.REGISTRY_TENCENT}}/{{.APP_NAME}}:{{.TAG | default "latest"}}

  # ============================
  # 部署
  # ============================
  deploy:
    desc: 完整部署（build + push + terraform apply）
    cmds:
      - task:build
      - task:push
      - cd infra/aliyun && terraform init && terraform apply -auto-approve

  # ============================
  # 清理
  # ============================
  clean:
    desc: 清理临时文件
    cmds:
      - rm -f .env.decrypted *.dec.yaml
      - docker system prune -f

  # ============================
  # 文档
  # ============================
  docs:view:
    desc: 在浏览器中打开方案文档
    cmds:
      - start C:\home\dev-system\README.md
    platforms: [windows]
