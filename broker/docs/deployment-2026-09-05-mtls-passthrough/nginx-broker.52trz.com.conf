# Secret Broker - 直连入口 (nginx TLS 终结 -> 127.0.0.1:8443)
# 2026-08-12: 从 Cloudflare Tunnel 切换到直连, 避免 CF anycast 在大陆被劫持
# 2026-09-06: 443 仅用于普通 HTTPS/dashboard；mTLS 仅在本机 8443 入口
#   禁止在公网 TLS 终结点请求可选客户端证书，避免浏览器/Windows 客户端握手失败。
# 部署: /etc/nginx/vhost/broker.52trz.com.conf
# 证书: /root/.acme.sh/acme.sh --issue -d broker.52trz.com --webroot /www/wwwroot/52trz-main --keylength ec-256
#   -> install 到 /etc/nginx/cert/broker.52trz.com/

server {
    listen 80;
    server_name broker.52trz.com;

    if ($is_scanner) { return 444; }

    # Let's Encrypt HTTP-01 验证
    location /.well-known/acme-challenge/ {
        root /www/wwwroot/52trz-main;
    }

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name broker.52trz.com;

    if ($is_scanner) { return 444; }

    ssl_certificate /etc/nginx/cert/broker.52trz.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/broker.52trz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    client_max_body_size 10m;

    include /etc/nginx/vhost/_security-headers.conf;
    include /etc/nginx/vhost/_blocklist;

    # mavis 2026-09-04: 排除 _blocklist 的 secret|secrets regex 误伤
    # _blocklist line: `location ~* /api/(v\d+/)?(admin|debug|config|env|secret|secrets|internal)$ { return 444; }`
    # 把 broker V3/V4 业务路径 /api/v1/secrets 跟 /api/v1/secrets/resolve 等挡住
    # 用 ^~ prefix 匹配, 优先级最高, 跳过 blocklist 的 regex 匹配
    location ^~ /api/v1/secrets {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify on;
        proxy_ssl_protocols TLSv1.3;
        proxy_ssl_server_name on;
        proxy_ssl_name broker.52trz.com;
        proxy_ssl_certificate /opt/secret-broker/pki/proxies/nginx-proxy.crt;
        proxy_ssl_certificate_key /opt/secret-broker/pki/proxies/nginx-proxy.key;
        proxy_ssl_trusted_certificate /opt/secret-broker/pki/ca/ca.crt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        # Never accept caller-controlled identity metadata on the public edge.
        proxy_set_header X-SSL-Client-Cert "";
        proxy_set_header X-SSL-Client-Verify "";
        proxy_set_header X-SSL-Client-DN "";
        proxy_read_timeout 120;
        proxy_connect_timeout 10;
        proxy_send_timeout 120;
    }

    # broker 后端是自签证书且只接受 TLSv1.3, nginx 作为 TLS 终结者
    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify on;
        proxy_ssl_protocols TLSv1.3;
        proxy_ssl_server_name on;
        proxy_ssl_name broker.52trz.com;
        proxy_ssl_certificate /opt/secret-broker/pki/proxies/nginx-proxy.crt;
        proxy_ssl_certificate_key /opt/secret-broker/pki/proxies/nginx-proxy.key;
        proxy_ssl_trusted_certificate /opt/secret-broker/pki/ca/ca.crt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        # Never accept caller-controlled identity metadata on the public edge.
        proxy_set_header X-SSL-Client-Cert "";
        proxy_set_header X-SSL-Client-Verify "";
        proxy_set_header X-SSL-Client-DN "";
        proxy_read_timeout 120;
        proxy_connect_timeout 10;
        proxy_send_timeout 120;
    }

    access_log /var/log/nginx/vhost/broker.52trz.com.log;
    error_log /var/log/nginx/vhost/broker.52trz.com.error.log;
}
