[package]
name = "secret-broker-desktop"
version = "0.1.0"
description = "Secret Broker desktop client"
edition = "2024"
license = "MIT"
default-run = "secret-broker-desktop"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
keyring = { version = "=3.6.3", features = ["windows-native", "apple-native", "sync-secret-service"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-opener = "=2.5.5"
zeroize = "=1.9.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
