# Grafana dashboard provisioning
# Auto-loads the Secret Broker dashboard on Grafana start
apiVersion: 1
providers:
  - name: Secret Broker
    orgId: 1
    folder: 'Secret Broker'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
