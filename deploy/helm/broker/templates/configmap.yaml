apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "broker.fullname" . }}-config
  labels:
    {{- include "broker.labels" . | nindent 4 }}
data:
  # Broker YAML config. Secret material is loaded from secrets/broker.yaml
  # via a separate secret volume mount, but defaults are provided here.
  config.yaml: |
    # Generated by Helm chart {{ .Chart.Name }}-{{ .Chart.Version }}
    broker:
      version: "{{ .Chart.AppVersion }}"
      hostname: "{{ include "broker.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local"
    auto_rotate:
      enabled: {{ .Values.config.autoRotate }}
    mfa_policy:
      enabled: {{ .Values.config.mfaPolicy.enabled }}
      factors:
        {{- toYaml .Values.config.mfaPolicy.factors | nindent 8 }}
      risk_threshold: {{ .Values.config.mfaPolicy.riskThreshold }}
    websocket:
      enabled: {{ .Values.config.websocket.enabled }}
      heartbeat_interval_ms: {{ .Values.config.websocket.heartbeatIntervalMs }}
    workload_identity:
      enabled: {{ .Values.config.workloadIdentity.enabled }}
      {{- if .Values.config.workloadIdentity.providers }}
      providers:
        {{- toYaml .Values.config.workloadIdentity.providers | nindent 8 }}
      {{- end }}
    ssh_proxy:
      enabled: {{ .Values.config.sshProxy.enabled }}
    alerting:
      enabled: {{ .Values.config.alerting.enabled }}
      default_channel: {{ .Values.config.alerting.defaultChannel }}
      {{- if .Values.config.alerting.channels }}
      channels:
        {{- toYaml .Values.config.alerting.channels | nindent 8 }}
      {{- end }}
