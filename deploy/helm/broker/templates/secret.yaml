{{- if or .Values.secrets.brokerYaml .Values.secrets.tlsCert .Values.secrets.tlsKey .Values.secrets.caCert }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "broker.fullname" . }}-secret
  labels:
    {{- include "broker.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.brokerYaml }}
  # SOPS-encrypted broker.yaml (base64-encoded by helm --set-file)
  broker.yaml: {{ .Values.secrets.brokerYaml | b64enc | quote }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "broker.fullname" . }}-tls
  labels:
    {{- include "broker.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  {{- if .Values.secrets.tlsCert }}
  tls.crt: {{ .Values.secrets.tlsCert | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.tlsKey }}
  tls.key: {{ .Values.secrets.tlsKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.caCert }}
  ca.crt: {{ .Values.secrets.caCert | b64enc | quote }}
  {{- end }}
