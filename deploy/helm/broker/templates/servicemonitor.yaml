{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "broker.fullname" . }}
  labels:
    {{- include "broker.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "broker.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      scheme: HTTPS
      tlsConfig:
        # The broker's metrics endpoint is served on the same mTLS port as the
        # main API. Prometheus scrapers typically present no client cert; the
        # broker should be configured to allow unauthenticated reads of /metrics.
        # For private CAs, supply the CA bundle via `caFile` / `ca`.
        insecureSkipVerify: true
      honorLabels: {{ .Values.serviceMonitor.honorLabels }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
          action: replace
          targetLabel: instance
{{- end }}
