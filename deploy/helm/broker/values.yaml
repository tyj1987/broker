# Default values for broker.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of broker replicas
replicaCount: 2

image:
  # -- Image repository
  repository: ghcr.io/tyj1987/broker
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag (defaults to chart appVersion when empty)
  tag: ""
  # -- Immutable sha256 digest. Required for production releases.
  digest: ""

# -- Image pull secrets (e.g. for ghcr.io private repos)
imagePullSecrets: []
# - name: regcred

# -- Override name
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # -- Whether to create a service account
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- Service account name (generated if empty)
  name: ""

# -- Pod-level annotations
podAnnotations: {}
# -- Pod-level security context
podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532

# -- Container-level security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL

service:
  # -- Service type
  type: ClusterIP
  # -- Service port for the mTLS listener
  port: 8443
  # -- Container port
  targetPort: 8443

ingress:
  # -- Whether to create an Ingress
  enabled: false
  className: ""
  annotations: {}
  # -- Ingress hosts
  hosts:
    - host: broker.local
      paths:
        - path: /
          pathType: Prefix
  # -- TLS configuration
  tls: []
  # - secretName: broker-tls
  #   hosts:
  #     - broker.local

resources:
  # -- CPU/Memory limits
  limits:
    cpu: 1000m
    memory: 512Mi
  # -- CPU/Memory requests
  requests:
    cpu: 200m
    memory: 256Mi

coreResources:
  limits:
    cpu: 200m
    memory: 64Mi
  requests:
    cpu: 20m
    memory: 16Mi

# -- Horizontal Pod Autoscaler settings
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# -- Persistent volume for SOPS-encrypted secrets
persistence:
  enabled: true
  # -- PVC size
  size: 1Gi
  # -- Storage class (use cluster default when empty)
  storageClass: ""
  # -- Access modes
  accessModes:
    - ReadWriteOnce

# -- Node selector
nodeSelector: {}
tolerations: []
affinity: {}

# -- Configuration values injected into the broker ConfigMap
config:
  # -- Auto-rotate is OFF by default (most types need manual rotation)
  autoRotate: false
  # -- MFA policy
  mfaPolicy:
    enabled: true
    factors:
      - totp
      - webauthn
    riskThreshold: 60
  # -- WebSocket events
  websocket:
    enabled: true
    heartbeatIntervalMs: 30000
  # -- Workload identity providers
  workloadIdentity:
    enabled: false
    providers: {}
    # aliyun:
    #   oidcProviderArn: "acs:ram::123:oidc-provider/cluster"
    #   roleArns: ["acs:ram::123:role/app"]
  # -- SSH Proxy enabled
  sshProxy:
    enabled: true
  # -- Auto-port rotation
  alerting:
    enabled: true
    defaultChannel: console
    channels: []

# -- References to secrets provisioned outside Helm. Secret values must not be
# passed on the command line or stored in Helm release history.
secrets:
  # -- Existing secret containing broker.yaml.
  configSecretName: ""
  # -- Existing secret containing tls.crt, tls.key and ca.crt.
  tlsSecretName: ""

# -- Liveness/metrics probes
probes:
  liveness:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# `helm test` requires a dedicated, least-privilege client certificate. Never
# reuse an administrator or end-user certificate for this probe.
tests:
  enabled: false
  clientCertificateSecret: ""
  tlsServerName: broker.local
