limit_req_zone $binary_remote_addr zone=broker_public:10m rate=60r/m;

server {
    listen 443 ssl http2;
    server_name broker.52trz.com;

    ssl_certificate /etc/letsencrypt/live/broker.52trz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/broker.52trz.com/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_session_tickets off;

    ssl_client_certificate /etc/secret-broker/pki/ca/ca.crt;
    ssl_verify_client optional;
    ssl_verify_depth 2;

    client_max_body_size 1m;
    limit_req zone=broker_public burst=20 nodelay;

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name broker.52trz.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/secret-broker/pki/ca/ca.crt;
        proxy_ssl_verify_depth 2;

        # This certificate identifies nginx only. It must never be a user or AI
        # client certificate, and its fingerprint must be the sole entry in the
        # broker trusted_proxy_fingerprints list.
        proxy_ssl_certificate /etc/secret-broker/pki/workloads/nginx/client.crt;
        proxy_ssl_certificate_key /etc/secret-broker/pki/workloads/nginx/client.key;

        # Replace all externally supplied identity and forwarding metadata.
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;
        proxy_request_buffering on;
    }
}
