[workspace]
resolver = "2"
members = ["src-tauri"]

[workspace.package]
version = "0.1.0-alpha"
edition = "2021"
rust-version = "1.74"
authors = ["tyj1987 <broker@52trz.com>"]
license = "MIT"
homepage = "https://github.com/tyj1987/broker"
repository = "https://github.com/tyj1987/broker"
description = "Native desktop client for Secret Broker (Tauri 2.x)"
readme = "README.md"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }

# mTLS / TLS
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12"] }
rustls-pemfile = "2.1"
rcgen = "0.13"
x509-parser = "0.16"

# OS keychain
keyring = { version = "3.6", features = ["windows-native", "apple-native", "linux-native"] }

# HTTP + WebSocket
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls-vendored", "stream"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls-vendored"] }
url = "2.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error
thiserror = "1.0"
anyhow = "1.0"

# Crypto
ring = "0.17"
rand = "0.8"

# Tauri
tauri = { version = "2.0", features = ["tray-icon", "notification", "updater", "fs", "dialog", "shell", "window-state"] }
tauri-plugin-updater = "2.0"

# Misc
once_cell = "1.20"
parking_lot = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
incremental = true

# Reduce binary size by removing unused features from bundled C deps
[env]
SQLX_OFFLINE = "true"
