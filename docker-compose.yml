# docker-compose.yml for Secret Broker V4.2
#
# 主服务: Secret Broker (mTLS HTTPS, port 8443)
# 可选: 演示 app (profiles: example)
#
# 用法:
#   1. 准备 PKI + 加密 secrets
#      - ./pki/ca/ca.crt (public certificate only; never mount ca.key)
#      - ./pki/server/server.crt + server.key
#      - ./secrets/broker.yaml       (SOPS 加密)
#      - ./secrets/secrets-detail.json (SOPS 加密)
#   2. docker compose up -d broker
#   3. 验证: docker compose exec broker wget -qO- http://127.0.0.1:9080/health

name: secret-broker

services:

  policy-core:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: secret-broker:local
    command: ["/app/bin/secret-broker-policy"]
    restart: unless-stopped
    environment:
      - BROKER_CORE_SOCKET=/run/secret-broker/core.sock
    volumes:
      - broker-core-socket:/run/secret-broker
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - broker-net

  # ==========================================================
  # 主服务: Secret Broker
  # ==========================================================
  broker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: secret-broker:local
    container_name: secret-broker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443" # reverse-proxy upstream only
    volumes:
      - ./secrets:/var/lib/broker/secrets:ro
      - ./pki/ca/ca.crt:/run/secrets/broker/pki/ca/ca.crt:ro
      - ./pki/server/server.crt:/run/secrets/broker/pki/server/server.crt:ro
      - ./pki/server/server.key:/run/secrets/broker/pki/server/server.key:ro
      - broker-audit:/var/lib/broker/audit
      - broker-tmp:/tmp:size=64M
      - broker-core-socket:/run/secret-broker
    depends_on:
      - policy-core
    environment:
      - NODE_ENV=production
      - BROKER_BIND=0.0.0.0
      - PORT=8443
      - PKI_DIR=/run/secrets/broker/pki
      - AUDIT_DIR=/var/lib/broker/audit
      - SECRETS_DETAIL_PATH=/var/lib/broker/secrets/secrets-detail.json
      - CONFIG_PATH=/var/lib/broker/secrets/broker.yaml
      - BROKER_HEALTH_BIND=127.0.0.1:9080
      - BROKER_CORE_SOCKET=/run/secret-broker/core.sock
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # Probe the loopback-only health listener; the public listener requires mTLS.
      test:
        - "node"
        - "-e"
        - "require('node:http').get({host:'127.0.0.1',port:9080,path:'/health'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - broker-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M

  # ==========================================================
  # 可选: Prometheus (监控)
  # ==========================================================
  prometheus:
    image: prom/prometheus:v3.13.3@sha256:6976aa8a60fec930796ce5772b8d12da7a318a5daa8d40d69c5c7819a05eeed7
    container_name: broker-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/grafana/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - broker-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ==========================================================
  # 可选: Grafana (可视化)
  # ==========================================================
  grafana:
    image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    container_name: broker-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/grafana/dashboard.json:/var/lib/grafana/dashboards/broker.json:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
    secrets:
      - grafana_admin_password
    networks:
      - broker-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  broker-core-socket:
  broker-audit:
  broker-tmp:
  prometheus-data:
  grafana-data:

networks:
  broker-net:
    driver: bridge

secrets:
  grafana_admin_password:
    file: ./secrets/grafana-admin-password.txt
