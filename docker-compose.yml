# docker-compose.yml for Secret Broker V4.1
#
# 主服务: Secret Broker (mTLS HTTPS, port 8443)
# 可选: 演示 app (profiles: example)
#
# 用法:
#   1. 准备 PKI + 加密 secrets
#      - ./pki/ca/ca.crt
#      - ./pki/server/server.crt + server.key
#      - ./pki/clients/*.crt+key
#      - ./secrets/broker.yaml       (SOPS 加密)
#      - ./secrets/secrets-detail.json (SOPS 加密)
#   2. docker compose up -d broker
#   3. 验证: docker compose ps (healthcheck verifies the configured CA and TLS name)
#   4. 首次启动前准备 age/key.txt；node UID 1000 必须可读 CA/server/age，
#      可写 secrets/ 和 pki/clients/。不要对生产私钥执行宽泛 chmod。
#   5. 此文件只发布 loopback Origin；Nginx 转发身份边界需单独预发布验收。

name: secret-broker

services:

  # ==========================================================
  # 主服务: Secret Broker
  # ==========================================================
  broker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    # Local build tag only. A released deployment must set BROKER_IMAGE to its reviewed digest.
    image: ${BROKER_IMAGE:-secret-broker:4.9.0-local}
    container_name: secret-broker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      # SOPS atomic replacement requires a writable directory, not a single file mount.
      - type: bind
        source: ./secrets
        target: /var/lib/broker/secrets
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ./pki/ca
        target: /run/secrets/broker/pki/ca
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./pki/server
        target: /run/secrets/broker/pki/server
        read_only: true
        bind:
          create_host_path: false
      # Only client certificates and serial state need writes for issuance/rotation.
      - type: bind
        source: ./pki/clients
        target: /run/secrets/broker/pki/clients
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ./age
        target: /run/secrets/broker/age
        read_only: true
        bind:
          create_host_path: false
      - broker-audit:/var/lib/broker/audit
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    environment:
      NODE_ENV: production
      BROKER_BIND: 0.0.0.0
      PORT: "8443"
      PKI_DIR: /run/secrets/broker/pki
      TLS_CA: /run/secrets/broker/pki/ca/ca.crt
      CA_KEY_PATH: /run/secrets/broker/pki/ca/ca.key
      AUDIT_DIR: /var/lib/broker/audit
      CONFIG_PATH: /var/lib/broker/secrets/broker.yaml
      SECRETS_PATH: /var/lib/broker/secrets/common.env
      SECRETS_DETAIL_PATH: /var/lib/broker/secrets/secrets-detail.json
      SOPS_AGE_KEY_FILE: /run/secrets/broker/age/key.txt
      BROKER_PUBLIC_ORIGIN: ${BROKER_PUBLIC_ORIGIN:-https://broker.52trz.com}
      BROKER_TLS_SERVER_NAME: ${BROKER_TLS_SERVER_NAME:-broker.52trz.com}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # Explicit CMD form; verify TLS rather than accepting any peer certificate.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "const q=require('node:https').get({host:'127.0.0.1',port:8443,path:'/health',ca:require('node:fs').readFileSync(process.env.TLS_CA),servername:process.env.BROKER_TLS_SERVER_NAME},r=>{r.resume();process.exit(r.statusCode===200?0:1)});q.on('error',()=>process.exit(1));q.setTimeout(4000,()=>q.destroy(new Error('health timeout')));"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - broker-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M

  # ==========================================================
  # 可选: Prometheus (监控)
  # ==========================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: broker-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/grafana/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - broker-net

  # ==========================================================
  # 可选: Grafana (可视化)
  # ==========================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: broker-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/dashboard.json:/var/lib/grafana/dashboards/broker.json:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    networks:
      - broker-net

  # ==========================================================
  # 可选: Loki (审计 + 运行时日志聚合)
  # v4.6.0: 补齐部署,dashboard.json 的 DS_LOKI 面板开始有数据
  # ==========================================================
  loki:
    image: grafana/loki:2.9.0
    container_name: broker-loki
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    command:
      - --config.file=/etc/loki/local-config.yaml
    networks:
      - broker-net

  # ==========================================================
  # 可选: Promtail (从 docker json 日志抓 broker 输出送到 Loki)
  # ==========================================================
  promtail:
    image: grafana/promtail:2.9.0
    container_name: broker-promtail
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - --config.file=/etc/promtail/config.yml
    networks:
      - broker-net

volumes:
  broker-audit:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  broker-net:
    driver: bridge
