# docker-compose.yml for Secret Broker V4.1
#
# 主服务: Secret Broker (mTLS HTTPS, port 8443)
# 可选: 演示 app (profiles: example)
#
# 用法:
#   1. 准备 PKI + 加密 secrets
#      - ./pki/ca/ca.crt
#      - ./pki/server/server.crt + server.key
#      - ./pki/clients/*.crt+key
#      - ./secrets/broker.yaml       (SOPS 加密)
#      - ./secrets/secrets-detail.json (SOPS 加密)
#   2. docker compose up -d broker
#   3. 验证: docker compose exec broker wget -qO- https://localhost:8443/health

name: secret-broker

services:

  # ==========================================================
  # 主服务: Secret Broker
  # ==========================================================
  broker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ghcr.io/tyj1987/broker:4.1.1
    container_name: secret-broker
    restart: unless-stopped
    ports:
      - "8443:8443"     # mTLS HTTPS - 客户端证书保证安全
    volumes:
      - ./secrets:/var/lib/broker/secrets:ro
      - ./pki:/run/secrets/broker/pki:ro
      - broker-audit:/var/lib/broker/audit
      - broker-tmp:/tmp:size=64M
    environment:
      - NODE_ENV=production
      - BROKER_BIND=0.0.0.0
      - BROKER_PORT=8443
      - PKI_DIR=/run/secrets/broker/pki
      - AUDIT_DIR=/var/lib/broker/audit
      - SECRETS_DETAIL_PATH=/var/lib/broker/secrets/secrets-detail.json
      - BROKER_CONFIG_PATH=/var/lib/broker/secrets/broker.yaml
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      # distroless has no shell/curl — use node's https module directly
      test:
        - "node"
        - "-e"
        - "require('node:https').get({host:'127.0.0.1',port:8443,rejectUnauthorized:false,requestCert:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - broker-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M
    restart: unless-stopped

  # ==========================================================
  # 可选: Prometheus (监控)
  # ==========================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: broker-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/grafana/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - broker-net

  # ==========================================================
  # 可选: Grafana (可视化)
  # ==========================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: broker-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/dashboard.json:/var/lib/grafana/dashboards/broker.json:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    networks:
      - broker-net

volumes:
  broker-audit:
  broker-tmp:
  prometheus-data:
  grafana-data:

networks:
  broker-net:
    driver: bridge
