# infra/aliyun/app.yaml
# Kubernetes manifest applied via the alicloud_cs_kubernetes_application
# resource. Rendered with templatefile() so image_tag, db_host, etc.
# are substituted at apply time.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-first-app
  labels:
    app: my-first-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-first-app
  template:
    metadata:
      labels:
        app: my-first-app
    spec:
      containers:
        - name: app
          image: ${image_registry}/my-first-app:${image_tag}
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              value: "postgres://appuser:${db_password}@${db_host}:5432/myapp"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: my-first-app
spec:
  type: LoadBalancer
  selector:
    app: my-first-app
  ports:
    - port: 80
      targetPort: 3000
