site_name: Secret Broker
site_description: Policy-bound credential broker documentation
repo_url: https://github.com/tyj1987/broker
repo_name: tyj1987/broker
edit_uri: edit/master/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
plugins:
  - search
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true

nav:
  - Home: index.md
  - Quickstart: QUICKSTART.md
  - Threat model: THREAT-MODEL.md
  - Production acceptance: PRODUCTION-ACCEPTANCE.md
  - Residual risks: RESIDUAL-RISKS.md
  - Extending providers: EXTENDING.md
  - Workload identity: WORKLOAD-IDENTITY.md
  - SSH proxy: SSH-PROXY.md
  - WebSocket: WEBSOCKET.md
  - Tool registry: TOOL-REGISTRY.md
  - Automation tasks: AUTOMATION-TASKS.md
  - Execution tokens: EXECUTION-TOKENS.md
  - Audit integrity: AUDIT-INTEGRITY.md
  - Provider adapters:
      - GitHub: GITHUB-ADAPTER.md
      - Cloudflare: CLOUDFLARE-ADAPTER.md
  - Decision queue: DECISION_QUEUE.md
  - SDK reference: SDK-REFERENCE.md
  - FAQ: FAQ.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tyj1987
      name: GitHub
  generator: false
copyright: Copyright © 2026 tyj1987 — Released under the MIT License
