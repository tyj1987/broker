site_name: Secret Broker
site_description: AI-first mTLS secret broker with zero-credential-leakage
site_url: https://docs.broker.example.com
repo_url: https://github.com/tyj1987/broker
repo_name: tyj1987/broker
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - pymdownx.emoji:

plugins:
  - search
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true

nav:
  - Home: index.md
  - Quickstart: QUICKSTART.md
  - Architecture:
    - Overview: DESIGN-V4-MASTER-PLAN.md
    - Security Model: DESIGN-V4-SECURITY-MODEL.md
    - Identity & MFA: DESIGN-V4-IDENTITY-MFA.md
    - Provider Templates: DESIGN-V4-PROVIDER-TEMPLATES.md
    - API Calling Standards: DESIGN-V4-API-CALLING-STANDARDS.md
    - Roadmap: DESIGN-V4-ROADMAP.md
  - Guides:
    - AI Agents: QUICKSTART.md
    - Workload Identity: WORKLOAD-IDENTITY.md
    - SSH Proxy: SSH-PROXY.md
    - WebSocket Events: WEBSOCKET.md
    - Adding Secret Types: EXTENDING.md
    - Threat Model: THREAT-MODEL.md
    - Security Audit (2026-09-23): SECURITY-AUDIT-2026-09-23.md
    - Historical Audit (2026-09-05): SECURITY-AUDIT-2026-09-05.md
    - FAQ: FAQ.md
  - API Reference:
    - SDK Reference (covers all 4 SDKs): SDK-REFERENCE.md
  - Deployment:
    - Helm: README.md
    - Terraform: README.md
    - 52trz-specific Deploy: DEPLOY-52TRZ.md
    - Upgrade: 52TRZ-UPGRADE-1PAGE.md
  - Operations:
    - Runbook: RUNBOOK.md
    - Post-Deploy Checklist: POST-DEPLOY-CHECKLIST.md
    - Verify: VERIFY.md
    - Security: SECURITY.md
    - Status: STATUS.md
    - Commercial: COMMERCIAL.md
    - Support: SUPPORT.md
  - Reference:
    - Code Review: ../REVIEW.md
    - Changelog: CHANGELOG.md
    - Roadmap: ../ROADMAP-post-1.0.md
    - Contributing: CONTRIBUTING.md
    - v4.1 Release Notes: RELEASE-NOTES-v4.1.0.md
    - v4.1 Complete: V4.1-COMPLETE.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tyj1987
      name: GitHub
  generator: false
  analytics:
    provider: google
    property: G-XXXXXXXXXX

