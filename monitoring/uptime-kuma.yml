# monitoring/uptime-kuma.yml
# Self-hosted monitoring: HTTP/HTTPS probes, TCP, cert expiry, alerts.
# Run with: docker compose -f monitoring/uptime-kuma.yml up -d
# Then open http://localhost:3001 and add your endpoints.

version: '3.8'

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=Asia/Shanghai

  # Optional: Prometheus + Grafana for app metrics.
  # The Node app exposes Prometheus-format metrics at /metrics (TODO).
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    profiles: ["metrics"]

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=change-me-on-first-login
    profiles: ["metrics"]

volumes:
  uptime-kuma-data:
  prometheus-data:
  grafana-data:
