manifest_version: 1
id: postgresql
display_name: PostgreSQL
checked_at: 2026-09-09
status: contract_required
official_docs:
  - https://www.postgresql.org/docs/current/sql-set-transaction.html
  - https://www.postgresql.org/docs/current/runtime-config-client.html#GUC-DEFAULT-TRANSACTION-READ-ONLY
  - https://www.postgresql.org/docs/current/predefined-roles.html
  - https://www.postgresql.org/docs/current/protocol-flow.html
origins: []
authentication:
  priority: [workload_identity, short_lived_database_credential, isolated_tls_client_certificate]
  inject: { capability: isolated_query_runner }
  maximum_ttl_seconds: 300
  rotation: Mint a target-bound short-lived login for the isolated runner.
  revocation: Revoke the login and terminate its active sessions.
  signer_boundary: The Broker receives a fixed-query runner capability and never receives a password or private key.
operations:
  - id: database.inspect
    method: QUERY
    path_template: /queries/database.inspect.v1
    permission: fixed_catalog_read
    mutating: false
    approval: none
    parameters: { resource_ref: { type: string } }
    maximum_response_bytes: 4096
redaction: [password, connection_string, ssl_key, sql, rows]
contract_test: { account: isolated_postgresql_role, required: true, last_result: not_run }
