# Secret Broker - 直连入口 (nginx TLS 终结 -> 127.0.0.1:8443)
# 2026-08-12: 从 Cloudflare Tunnel 切换到直连, 避免 CF anycast 在大陆被劫持
# 2026-09-04: 加 mTLS 透传 — ssl_verify_client optional + X-SSL-Client-Cert header
# 2026-09-07: gzip + /health 限流；公网挡住 /ready /metrics /live
# 部署: /etc/nginx/vhost/broker.52trz.com.conf
# DNS: broker.52trz.com 必须 Cloudflare DNS-only（灰云）

limit_req_zone $binary_remote_addr zone=broker_health:10m rate=10r/s;

server {
    listen 80;
    server_name broker.52trz.com;

    if ($is_scanner) { return 444; }

    # Let's Encrypt HTTP-01 验证
    location /.well-known/acme-challenge/ {
        root /www/wwwroot/52trz-main;
    }

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name broker.52trz.com;

    if ($is_scanner) { return 444; }

    ssl_certificate /etc/nginx/cert/broker.52trz.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/broker.52trz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # nginx 接受可选客户端证书，用 broker CA 验链，再把 PEM 透传给源站。
    # optional：仪表盘密码登录可以没有 client cert。
    ssl_verify_client optional;
    ssl_client_certificate /opt/secret-broker/pki/ca/ca.crt;
    ssl_verify_depth 2;

    include /etc/nginx/vhost/_security-headers.conf;
    include /etc/nginx/vhost/_blocklist;

    # Ready / metrics / live 只允许本机；公网不要暴露指纹。
    location ~ ^/(ready|readyz|live|healthz|metrics|metrics\.json)$ {
        allow 127.0.0.1;
        deny all;
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_ssl_protocols TLSv1.3;
        proxy_ssl_certificate /opt/secret-broker/pki/clients/client.mavis.crt;
        proxy_ssl_certificate_key /opt/secret-broker/pki/clients/client.mavis.key;
        proxy_ssl_trusted_certificate /opt/secret-broker/pki/ca/ca.crt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
    }

    location = /health {
        limit_req zone=broker_health burst=20 nodelay;
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_ssl_protocols TLSv1.3;
        proxy_ssl_certificate /opt/secret-broker/pki/clients/client.mavis.crt;
        proxy_ssl_certificate_key /opt/secret-broker/pki/clients/client.mavis.key;
        proxy_ssl_trusted_certificate /opt/secret-broker/pki/ca/ca.crt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
        proxy_connect_timeout 5;
        proxy_read_timeout 10;
    }

    # 排除 _blocklist 的 secret|secrets regex 误伤 /api/v1/secrets
    location ^~ /api/v1/secrets {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_ssl_protocols TLSv1.3;
        proxy_ssl_certificate /opt/secret-broker/pki/clients/client.mavis.crt;
        proxy_ssl_certificate_key /opt/secret-broker/pki/clients/client.mavis.key;
        proxy_ssl_trusted_certificate /opt/secret-broker/pki/ca/ca.crt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
        proxy_read_timeout 120;
        proxy_connect_timeout 10;
        proxy_send_timeout 120;
    }

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_ssl_protocols TLSv1.3;
        proxy_ssl_certificate /opt/secret-broker/pki/clients/client.mavis.crt;
        proxy_ssl_certificate_key /opt/secret-broker/pki/clients/client.mavis.key;
        proxy_ssl_trusted_certificate /opt/secret-broker/pki/ca/ca.crt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
        proxy_read_timeout 120;
        proxy_connect_timeout 10;
        proxy_send_timeout 120;
    }

    access_log /var/log/nginx/vhost/broker.52trz.com.log;
    error_log /var/log/nginx/vhost/broker.52trz.com.error.log;
}
