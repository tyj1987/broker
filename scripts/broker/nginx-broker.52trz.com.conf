# Secret Broker - 直连入口 (nginx TLS 终结 -> 127.0.0.1:8443)
# 2026-08-12: 从 Cloudflare Tunnel 切换到直连, 避免 CF anycast 在大陆被劫持
# 部署: /etc/nginx/vhost/broker.52trz.com.conf
# 证书: /root/.acme.sh/acme.sh --issue -d broker.52trz.com --webroot /www/wwwroot/52trz-main --keylength ec-256
#   -> install 到 /etc/nginx/cert/broker.52trz.com/

server {
    listen 80;
    server_name broker.52trz.com;

    if ($is_scanner) { return 444; }

    # Let's Encrypt HTTP-01 验证
    location /.well-known/acme-challenge/ {
        root /www/wwwroot/52trz-main;
    }

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name broker.52trz.com;

    if ($is_scanner) { return 444; }

    ssl_certificate /etc/nginx/cert/broker.52trz.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/broker.52trz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    client_max_body_size 10m;

    include /etc/nginx/vhost/_security-headers.conf;

    # broker 后端是自签证书且只接受 TLSv1.3, nginx 作为 TLS 终结者
    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_ssl_protocols TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        proxy_connect_timeout 10;
        proxy_send_timeout 120;
    }

    access_log /var/log/nginx/vhost/broker.52trz.com.log;
    error_log /var/log/nginx/vhost/broker.52trz.com.error.log;
}
