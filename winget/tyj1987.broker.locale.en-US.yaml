ReleaseNotes: |-
  V4.1.1 (2026-09-06) — Security & correctness patch:
    * mTLS cert-as-session: cert-only clients (Mavis / Claude / Codex) can now
      POST /api/v1/login with their mTLS cert as the credential, bypassing
      the password check (TOTP MFA still applies if required)
    * Broker startup: fix DEP0187 DeprecationWarning in Node 22+ (no more
      "Passing invalid argument types to fs.existsSync is deprecated")
    * Version bump 4.1.0 → 4.1.1 (broker + 4 SDKs)
    * Test: phase-f-backup-probes synced to V4.1.1
    * No new features, fully backward-compatible with V4.1.0

  Full release notes: https://github.com/tyj1987/broker/releases/tag/v4.1.1
ReleaseNotesUrl: https://github.com/tyj1987/broker/releases/tag/v4.1.1
